<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <style>
    text { font-family: sans-serif; fill: #243044; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 14px; }
    .value { font-size: 11px; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .grid { stroke: #dbe3ec; stroke-width: 1; }
  </style>
  <text x="450" y="30" text-anchor="middle" class="title">정렬된 배열 실행 시간</text>
  <rect x="250" y="48" width="16" height="16" fill="#2563eb"/><text x="272" y="61" class="label">삽입 정렬</text>
  <rect x="390" y="48" width="16" height="16" fill="#f97316"/><text x="412" y="61" class="label">버블 정렬</text>
  <rect x="530" y="48" width="16" height="16" fill="#16a34a"/><text x="552" y="61" class="label">놈 정렬</text>
  <line x1="90" y1="360" x2="850" y2="360" class="axis"/>
  <line x1="90" y1="60" x2="90" y2="360" class="axis"/>
  <line x1="90" y1="210" x2="850" y2="210" class="grid"/>
  <line x1="90" y1="60" x2="850" y2="60" class="grid"/>
  <text x="78" y="365" text-anchor="end" class="label">0</text>
  <text x="78" y="215" text-anchor="end" class="label">0.0003</text>
  <text x="78" y="65" text-anchor="end" class="label">0.0006</text>
  <text x="470" y="410" text-anchor="middle" class="label">입력 크기 n</text>
  <text x="20" y="210" text-anchor="middle" class="label" transform="rotate(-90 20 210)">시간 (초)</text>
  <rect x="140" y="355" width="36" height="5" fill="#2563eb"/><rect x="184" y="357" width="36" height="3" fill="#f97316"/><rect x="228" y="358" width="36" height="2" fill="#16a34a"/>
  <rect x="320" y="357" width="36" height="3" fill="#2563eb"/><rect x="364" y="357" width="36" height="3" fill="#f97316"/><rect x="408" y="357" width="36" height="3" fill="#16a34a"/>
  <rect x="500" y="309.5" width="36" height="50.5" fill="#2563eb"/><rect x="544" y="308" width="36" height="52" fill="#f97316"/><rect x="588" y="288.5" width="36" height="71.5" fill="#16a34a"/>
  <rect x="680" y="109" width="36" height="251" fill="#2563eb"/><rect x="724" y="169" width="36" height="191" fill="#f97316"/><rect x="768" y="76" width="36" height="284" fill="#16a34a"/>
